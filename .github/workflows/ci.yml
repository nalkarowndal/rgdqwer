name: Studio validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: ffmpeg -version
      - run: ffprobe -version
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: python -m pip install -r worker/requirements-lock.txt
      - run: python -m pytest worker/tests voice_worker/tests -q
      - run: node scripts/smoke-analysis.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Short simulated-engine lifecycle soak
        run: npm run soak -- --duration-ms 20000 --cycles 20 --report test-results/m8-soak-ci.json
      - name: Build unsigned Windows installer
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Verify install, upgrade and retained data after uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-installer.ps1
      - uses: actions/upload-artifact@v4
        if: success() && runner.os == 'Windows'
        with:
          name: rgdqwer-windows-x64-unsigned
          retention-days: 14
          path: |
            release/*-unsigned-setup.exe
            release/*-unsigned-setup.exe.blockmap
            release/SHA256SUMS.txt
            docs/INSTALLATION.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ matrix.os }}
          path: test-results
